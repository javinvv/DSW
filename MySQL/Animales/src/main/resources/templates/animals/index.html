<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listar Animales</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Animales</h2>
        <a class="btn btn-primary" th:href="@{/animals/crear}">Crear Nuevo Animal</a>
    </div>

    <div class="card shadow-sm p-4">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Vida media</th>
                <th>Extinto</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="animal : ${animales}">
                <td th:text="${animal.id}"></td>
                <td th:text="${animal.nombre}"></td>
                <td th:text="${animal.vidaMedia}"></td>
                <td th:text="${animal.extinto}"></td>

                <!-- ¡TODOS LOS BOTONES JUNTOS EN UN ÚNICO TD! -->
                <td class="text-end">
                    <div class="btn-group btn-group-sm" role="group">
                        <a class="btn btn-dark" th:href="@{/animals/{id}(id=${animal.id})}">Detalles</a>
                        <a class="btn btn-outline-secondary" th:href="@{/animals/editar/{id}(id=${animal.id})}">Editar</a>
                        <a class="btn-borrar" th:href="@{/animals/borrar/{id}(id=${animal.id})}" >Borrar</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
