<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Animal</title>
    <link rel="stylesheet" th:href="@{/css/crear.css}">
</head>
<body>

<div class="contenedor">
    <h2>Crear Nuevo Animal</h2>

    <form action="#" th:action="@{/animals/crear}" th:object="${animal}" method="post" class="formulario">

        <!-- Campo Nombre -->
        <div class="form-grupo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Dodo">
        </div>

        <!-- Campo Vida Media -->
        <div class="form-grupo">
            <label for="vidaMedia">Vida Media (años):</label>
            <input type="number" id="vidaMedia" th:field="*{vidaMedia}" placeholder="Ej. 30">
        </div>

        <!-- Campo Extinto (Checkbox) -->
        <div class="form-grupo-check">
            <input type="checkbox" id="extinto" th:field="*{extinto}">
            <label for="extinto">¿Está extinto?</label>
        </div>

        <!-- Botones de acción -->
        <div class="acciones">
            <a th:href="@{/animals/index}" class="btn-cancelar">Cancelar</a>
            <input  th:href="@{/animals/index}" type="submit" value="Crear" class="btn-guardar">
        </div>
    </form>
</div>

</body>
</html>
