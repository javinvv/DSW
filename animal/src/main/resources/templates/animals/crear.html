<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
        .v{
            margin-bottom: 25px;
        }
        .n{
            margin-bottom: 25px;
        }
        .e{
            margin-bottom: 25px;
        }
        .header{
            background-color: dodgerblue;
            border: solid 1px dodgerblue;
        }
    </style>
</head>
<body>
<div class = "header"><h3>Animalia</h3></div>
<h2>Crear Nuevo Animal</h2>
    <form action="#" th:action="@{/animals/crear}" th:object="${animal}" method="post">
        <div class = "n">
            <div>Nombre:</div>
            <label for="name"></label>
            <input type="text" id="name" th:field="*{nombre}" class="form-control">

            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                Este campo no puede estar en blanco
            </div>
        </div>
        <div class = "v">
            <label for="vida" class="form-label">Vida Media</label>
            <input type="number" id="vida" th:field="*{vida}" value="-1" class="form-control">

            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('vida')}" th:errors="*{vidaMedia}">
                La edad media ha de ser un número positivo
            </div>
        </div>
        <div class = "e">
            <input type="checkbox" id="extinto" th:field="*{extinto}" class="form-check-input">
            <label for="extinto" class="form-check-label text-muted">Marcar si está extinto</label>
        </div>

        <input type="submit" value="Crear">
        <div>
            <a th:href="@{/animals}" class="text-decoration-none">Volver al listado</a>
        </div>
    </form>
</body>
</html>
